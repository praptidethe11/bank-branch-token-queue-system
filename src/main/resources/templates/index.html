<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank Branch Token Queue System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Bank Branch Token Queue System</h1>
    <label>Role
        <select id="role">
            <option value="RECEPTIONIST">RECEPTIONIST</option>
            <option value="TELLER">TELLER</option>
            <option value="MANAGER">MANAGER</option>
        </select>
    </label>
</header>

<div id="message" role="status"></div>

<section class="card">
    <h2>Create token</h2>
    <input id="customerName" type="text" placeholder="Customer name">
    <select id="serviceType">
        <option value="GENERAL">GENERAL</option>
        <option value="LOAN">LOAN</option>
        <option value="ADVISORY">ADVISORY</option>
    </select>
    <button id="createBtn" type="button">Create token</button>
</section>

<section class="card">
    <h2>Search</h2>
    <select id="searchBy">
        <option value="tokenNumber">tokenNumber</option>
        <option value="name">name</option>
        <option value="status">status</option>
    </select>
    <input id="searchInput" type="text" placeholder="Search value">
    <button id="searchBtn" type="button">Search</button>
    <button id="clearBtn" type="button">Show all</button>
</section>

<section class="card">
    <h2>Tokens</h2>
    <table id="tokenTable">
        <thead>
        <tr><th>Token</th><th>Customer</th><th>Service</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="tokenBody"></tbody>
    </table>
</section>

<section class="card">
    <h2>Dashboard (Manager)</h2>
    <button id="refreshDashboard" type="button">Refresh dashboard</button>
    <div id="dashboardMessage"></div>
    <div class="counts">
        <div>Waiting: <b id="countWaiting">-</b></div>
        <div>Serving: <b id="countServing">-</b></div>
        <div>Completed: <b id="countCompleted">-</b></div>
        <div>Cancelled: <b id="countCancelled">-</b></div>
        <div>Total: <b id="countTotal">-</b></div>
    </div>
</section>

<script src="app.js"></script>
</body>
</html>
