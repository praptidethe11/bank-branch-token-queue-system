---
- name: Configure Bank Branch Token Queue System node
  hosts: bank_nodes
  become: true
  vars:
    app_user: tokenqueue
    app_group: tokenqueue
    app_home: /opt/token-queue
    log_dir: /var/log/token-queue
    conf_dir: /etc/token-queue
    app_port: 8082
    war_src: "{{ playbook_dir }}/../target/token-queue-system.war"

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - openjdk-21-jre-headless
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create application group
      ansible.builtin.group:
        name: "{{ app_group }}"
        system: true

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ app_home }}"
        create_home: false

    - name: Create application folders
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ app_group }}"
        mode: "0755"
      loop:
        - { path: "{{ app_home }}", owner: "{{ app_user }}" }
        - { path: "{{ log_dir }}", owner: "{{ app_user }}" }
        - { path: "{{ conf_dir }}", owner: "root" }

    - name: Copy application war
      ansible.builtin.copy:
        src: "{{ war_src }}"
        dest: "{{ app_home }}/token-queue-system.war"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0640"
      notify: Restart token-queue

    - name: Write environment file
      ansible.builtin.copy:
        dest: "{{ conf_dir }}/token-queue.env"
        content: |
          SERVER_PORT={{ app_port }}
        owner: root
        group: "{{ app_group }}"
        mode: "0640"
      notify: Restart token-queue

    - name: Install systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/token-queue.service
        content: |
          [Unit]
          Description=Bank Branch Token Queue System
          After=network.target

          [Service]
          User={{ app_user }}
          Group={{ app_group }}
          WorkingDirectory={{ app_home }}
          EnvironmentFile={{ conf_dir }}/token-queue.env
          ExecStart=/usr/bin/java -jar {{ app_home }}/token-queue-system.war
          StandardOutput=append:{{ log_dir }}/app.log
          StandardError=append:{{ log_dir }}/app.log
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart token-queue

    - name: Apply pending changes now
      ansible.builtin.meta: flush_handlers

    - name: Enable and start the service
      ansible.builtin.systemd:
        name: token-queue
        enabled: true
        state: started

    - name: Wait for port {{ app_port }}
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ app_port }}"
        delay: 5
        timeout: 90

    - name: Check the application answers
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/"
        status_code: 200
      register: health
      retries: 10
      delay: 3
      until: health.status == 200

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart token-queue
      ansible.builtin.systemd:
        name: token-queue
        state: restarted
